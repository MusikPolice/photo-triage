# CI on every push and PR (docs/dev-environment.md §8).
# Jobs still to come as their code lands: contract, and (on main/nightly) the
# model tier and e2e.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # The pins mise.toml doesn't cover (dev-environment §2).
      - name: Load versions.env
        run: grep -E '^[A-Z0-9_]+=' versions.env >> "$GITHUB_ENV"

      - uses: jdx/mise-action@v5
        with:
          install_args: python uv just shellcheck hadolint

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/uv
            ~/.cache/pre-commit
          key: backend-${{ hashFiles('backend/uv.lock', '.pre-commit-config.yaml') }}
          restore-keys: backend-

      # The export group (torch, open_clip) is only for the one-off CLIP export.
      # TODO(Phase 2): install the pinned exiftool and ffmpeg once tests use them.
      - name: Install dependencies
        working-directory: backend
        run: |
          uv sync --locked --no-group export
          uv tool install "pre-commit==$PRE_COMMIT_VERSION"

      # The frontend hooks need node_modules; the frontend job covers them.
      - name: pre-commit (format, lint, shellcheck, hadolint, file-mutation guard, secrets, media guard)
        env:
          SKIP: prettier,eslint,pnpm-lock
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Import contracts
        working-directory: backend
        run: uv run --no-sync lint-imports

      - name: pyright
        run: just typecheck

      - name: Tests and coverage
        run: just test

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          install_args: node pnpm

      - name: Find the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: frontend-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: frontend-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: svelte-check (strict)
        run: pnpm run check

      - name: eslint
        run: pnpm run lint

      - name: prettier
        run: pnpm run format:check

      - name: Vitest
        run: pnpm run test

      - name: vite build
        run: pnpm run build

  migrations:
    runs-on: ubuntu-24.04
    env:
      # The CLI reads DATA_DIR through the app settings, which also require the
      # other two. Relative to the checkout; none of them need to exist.
      PHOTO_DIR: ci/photos
      TRASH_DIR: ci/trash
      DATA_DIR: ci/data
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          install_args: python uv just

      - uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: migrations-${{ hashFiles('backend/uv.lock') }}
          restore-keys: migrations-

      - name: Install dependencies
        working-directory: backend
        run: uv sync --locked --no-group export

      - name: Upgrade from empty, downgrade, upgrade again
        run: |
          alembic() { uv run --no-sync --project backend alembic -c backend/alembic.ini "$@"; }
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Models and migrations agree (alembic check)
        run: uv run --no-sync --project backend alembic -c backend/alembic.ini check

      # A migration that's on main may already have run against real databases.
      # Changing it would leave those databases out of step with fresh ones, so
      # a PR may add migrations but not modify, rename or delete existing ones.
      - name: Merged migrations are unchanged
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          changed="$(git diff --name-status --diff-filter=MDR "origin/$BASE_REF" HEAD \
            -- backend/src/photo_triage/db/migrations/versions/)"
          if [ -n "$changed" ]; then
            echo "::error::Migrations already on $BASE_REF were changed. Add a new migration instead:"
            echo "$changed"
            exit 1
          fi

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Every version the Dockerfile takes, from mise.toml and versions.env.
      - name: Read the pins
        id: pins
        run: |
          {
            echo "build_args<<EOF"
            scripts/image_pins.sh
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          tags: photo-triage:ci
          build-args: ${{ steps.pins.outputs.build_args }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The app, the frontend, the pinned tools, the user, the left-out
      # dependency groups, and the worker.
      - name: Smoke test
        run: scripts/docker_smoke.sh photo-triage:ci

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          install_args: python uv just

      - name: Install pip-audit
        working-directory: backend
        run: uv sync --locked --only-group dev

      - name: pip-audit (runtime dependencies)
        run: just audit
