# CI on every push and PR (docs/dev-environment.md §8).
# Jobs still to come as their code lands: on main/nightly, the model tier and e2e.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # The pins mise.toml doesn't cover (dev-environment §2).
      - name: Load versions.env
        run: grep -E '^[A-Z0-9_]+=' versions.env >> "$GITHUB_ENV"

      - uses: jdx/mise-action@v5
        with:
          install_args: python uv just shellcheck hadolint

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/uv
            ~/.cache/pre-commit
          key: backend-${{ hashFiles('backend/uv.lock', '.pre-commit-config.yaml') }}
          restore-keys: backend-

      # exiftool and ffmpeg pinned in versions.env, as scripts/bootstrap.sh and
      # docker/Dockerfile install them. The fixture tests run them.
      - uses: actions/cache@v6
        id: media-tools
        with:
          path: ~/media-tools
          key: media-tools-${{ env.EXIFTOOL_SHA256 }}-${{ env.FFMPEG_SHA256 }}

      - name: Download exiftool and ffmpeg
        if: steps.media-tools.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/media-tools/exiftool ~/media-tools/ffmpeg
          curl --fail --silent --show-error --location --retry 3 --output /tmp/exiftool.tar.gz \
            "https://sourceforge.net/projects/exiftool/files/Image-ExifTool-${EXIFTOOL_VERSION}.tar.gz/download"
          echo "${EXIFTOOL_SHA256}  /tmp/exiftool.tar.gz" | sha256sum --check
          tar -xzf /tmp/exiftool.tar.gz -C ~/media-tools/exiftool --strip-components=1
          # The release URL is rolling, so old-releases comes first and the checksum guards against drift.
          for url in \
            "https://johnvansickle.com/ffmpeg/old-releases/ffmpeg-${FFMPEG_VERSION}-amd64-static.tar.xz" \
            "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz"; do
            curl --fail --silent --show-error --location --retry 3 --output /tmp/ffmpeg.tar.xz "$url" \
              && echo "${FFMPEG_SHA256}  /tmp/ffmpeg.tar.xz" | sha256sum --check --status \
              && break
            rm -f /tmp/ffmpeg.tar.xz
          done
          test -f /tmp/ffmpeg.tar.xz
          tar -xJf /tmp/ffmpeg.tar.xz -C ~/media-tools/ffmpeg --strip-components=1

      - name: Put exiftool and ffmpeg on PATH and check their versions
        run: |
          echo ~/media-tools/exiftool >> "$GITHUB_PATH"
          echo ~/media-tools/ffmpeg >> "$GITHUB_PATH"
          PATH=~/media-tools/exiftool:~/media-tools/ffmpeg:$PATH
          test "$(exiftool -ver)" = "$EXIFTOOL_VERSION"
          ffmpeg -version | head -1 | grep -F "ffmpeg version ${FFMPEG_VERSION}-static "
          ffprobe -version | head -1 | grep -F "ffprobe version ${FFMPEG_VERSION}-static "

      # The export group (torch, open_clip) is only for the one-off CLIP export.
      - name: Install dependencies
        working-directory: backend
        run: |
          uv sync --locked --no-group export
          uv tool install "pre-commit==$PRE_COMMIT_VERSION"

      # The frontend hooks need node_modules; the frontend job covers them.
      - name: pre-commit (format, lint, shellcheck, hadolint, file-mutation guard, secrets, media guard)
        env:
          SKIP: prettier,eslint,pnpm-lock
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Import contracts
        working-directory: backend
        run: uv run --no-sync lint-imports

      - name: pyright
        run: just typecheck

      - name: Tests and coverage
        run: just test

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          install_args: node pnpm

      - name: Find the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: frontend-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: frontend-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: svelte-check (strict)
        run: pnpm run check

      - name: eslint
        run: pnpm run lint

      - name: prettier
        run: pnpm run format:check

      - name: Vitest
        run: pnpm run test

      - name: vite build
        run: pnpm run build

  # The frontend's API types match the backend's OpenAPI schema.
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          install_args: python uv node pnpm

      - uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: contract-${{ hashFiles('backend/uv.lock') }}
          restore-keys: contract-

      - name: Install dependencies
        run: |
          uv sync --locked --no-group export --project backend
          pnpm --dir frontend install --frozen-lockfile

      - name: API types are up to date
        run: scripts/api_types.sh --check

  migrations:
    runs-on: ubuntu-24.04
    env:
      # The CLI reads DATA_DIR through the app settings, which also require
      # PHOTO_DIR. Relative to the checkout; neither needs to exist.
      PHOTO_DIR: ci/photos
      DATA_DIR: ci/data
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          install_args: python uv just

      - uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: migrations-${{ hashFiles('backend/uv.lock') }}
          restore-keys: migrations-

      - name: Install dependencies
        working-directory: backend
        run: uv sync --locked --no-group export

      - name: Upgrade from empty, downgrade, upgrade again
        run: |
          alembic() { uv run --no-sync --project backend alembic -c backend/alembic.ini "$@"; }
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Models and migrations agree (alembic check)
        run: uv run --no-sync --project backend alembic -c backend/alembic.ini check

      # A migration that's on main may already have run against real databases.
      # Changing it would leave those databases out of step with fresh ones, so
      # a PR may add migrations but not modify, rename or delete existing ones.
      - name: Merged migrations are unchanged
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          changed="$(git diff --name-status --diff-filter=MDR "origin/$BASE_REF" HEAD \
            -- backend/src/photo_triage/db/migrations/versions/)"
          if [ -n "$changed" ]; then
            echo "::error::Migrations already on $BASE_REF were changed. Add a new migration instead:"
            echo "$changed"
            exit 1
          fi

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Every version the Dockerfile takes, from mise.toml and versions.env.
      - name: Read the pins
        id: pins
        run: |
          {
            echo "build_args<<EOF"
            scripts/image_pins.sh
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          tags: photo-triage:ci
          build-args: ${{ steps.pins.outputs.build_args }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The app, the frontend, the pinned tools, the user, the left-out
      # dependency groups, and the worker.
      - name: Smoke test
        run: scripts/docker_smoke.sh photo-triage:ci

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          install_args: python uv just

      - name: Install pip-audit
        working-directory: backend
        run: uv sync --locked --only-group dev

      - name: pip-audit (runtime dependencies)
        run: just audit
