# Alembic config for the CLI. Run from the repo root, where DATA_DIR resolves:
#   uv run --project backend alembic -c backend/alembic.ini upgrade head
# The database URL comes from the settings (DATA_DIR) unless sqlalchemy.url is set.

[alembic]
script_location = photo_triage.db:migrations
file_template = %%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
