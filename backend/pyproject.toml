[project]
name = "photo-triage"
version = "0.1.0"
description = "Self-hosted photo library explorer and triage tool"
readme = "../README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    # API and storage
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Images and video
    "pillow>=11",
    "pillow-heif>=0.20",
    "opencv-python-headless>=4.10",
    # ML inference (CPU)
    "numpy>=2.1",
    "onnxruntime>=1.20",
    "insightface>=0.7.3",
    "umap-learn>=0.5.7",
    "scikit-learn>=1.5", # includes HDBSCAN
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6",
    "hypothesis>=6.115",
    "httpx>=0.28",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "import-linter>=2.1",
    "pip-audit>=2.7",
]
# One-off CLIP export to ONNX (scripts/export_clip_onnx.py). Not in the runtime image.
export = [
    "open-clip-torch>=2.29",
    "torch>=2.5",
    "torchvision>=0.20",
    "onnx>=1.17",
    "onnxscript>=0.2", # torch.onnx.export backend
]

[tool.uv]
default-groups = ["dev", "export"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

# ---------------------------------------------------------------------------
# Checks (docs/dev-environment.md §7–8)
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # isort
    "B",            # bugbear
    "UP",           # pyupgrade
    "SIM",          # simplify
    "RUF",
    "TID",          # tidy-imports, including the banned-api list below
]

# Only photo_triage.files may move, delete, or rewrite files. Path methods and
# exiftool invocations are caught by scripts/check_file_mutation.py, since Ruff
# can't resolve those.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"os.remove".msg = "Only photo_triage.files may delete files."
"os.unlink".msg = "Only photo_triage.files may delete files."
"os.rmdir".msg = "Only photo_triage.files may delete files."
"os.removedirs".msg = "Only photo_triage.files may delete files."
"os.rename".msg = "Only photo_triage.files may move files."
"os.renames".msg = "Only photo_triage.files may move files."
"os.replace".msg = "Only photo_triage.files may move files."
"os.utime".msg = "Only photo_triage.files may change file times."
"shutil.move".msg = "Only photo_triage.files may move files."
"shutil.rmtree".msg = "Only photo_triage.files may delete files."

[tool.ruff.lint.per-file-ignores]
"src/photo_triage/files/**" = ["TID251"]
"tests/**" = ["TID251"]

[tool.pyright]
include = ["src", "tests", "../scripts"]
pythonVersion = "3.13"
typeCheckingMode = "basic"  # tests and scripts
strict = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-m", "not models"]
markers = ["models: runs real ML models on cached weights (slow; `just test-models`)"]

[tool.coverage.run]
branch = true
source = ["photo_triage"]
omit = ["src/photo_triage/ml/*"]  # real adapters are covered by the model tier

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true

[tool.importlinter]
root_package = "photo_triage"

[[tool.importlinter.contracts]]
name = "api and pipeline use only the public interface of files"
type = "forbidden"
source_modules = ["photo_triage.api", "photo_triage.pipeline"]
forbidden_modules = ["photo_triage.files.**"]
# Only direct imports count: importing `photo_triage.files` itself reaches its
# submodules through its __init__, which is the public interface working as meant.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "ml adapters don't depend on db or api"
type = "forbidden"
source_modules = ["photo_triage.ml"]
forbidden_modules = ["photo_triage.db", "photo_triage.api"]
